<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Nebulo</title>
  <!-- Bootstrap CSS -->
  <link rel="stylesheet" href="https://stackpath.bootstrapcdn.com/bootstrap/4.5.2/css/bootstrap.min.css">
  <style>
    body {
      background-color: #f8f9fa;
    }
    .container {
      margin-top: 50px;
    }
    .form-group label {
      font-weight: bold;
    }
    h1 {
      margin-bottom: 40px;
      text-align: center;
      color: #007bff; 
      font-size: 3.5rem; 
      text-shadow: 2px 2px 4px rgba(0,0,0,0.4);
    }
    h2 {
      margin-top: 40px;
      color: #6c757d;
    }
    .btn-primary {
      width: 100%;
      padding: 10px;
      font-size: 18px;
    }
    .no-results {
      text-align: center;
      color: #dc3545;
      font-size: 1.5rem;
      margin-top: 20px;
    }
    tr.clickable-row {
      cursor: pointer;
    }
    tr.clickable-row:hover {
      background-color: #f1f1f1;
    }
  </style>
</head>
<body>
  <div class="container">
    <h1>Nebulo</h1>
    <form method="POST">
      <div class="form-group">
        <label for="query">Enter your query:</label>
        <input type="text" class="form-control" id="query" name="query" placeholder="Type something...">
      </div>
      <button type="submit" class="btn btn-primary">Search</button>
    </form>

    {% if message %}
      <p class="no-results">{{ message }}</p>
    {% elif results %}
      <h2>Search results:</h2>
      <table class="table table-striped">
        <thead class="thead-dark">
          <tr>
            <th style="width: 10%;">Docno</th>
            <th>Document Text</th>
          </tr>
        </thead>
        <tbody>
          {% for result in results %}
            <tr 
              class="clickable-row" 
              data-toggle="modal" 
              data-target="#resultModal" 
              data-docno="{{ result.docno }}" 
              data-fulltext="{{ result.document_text }}">
              <td>{{ result.docno }}</td>
              <td>{{ result.document_text[:100] }}...</td>
            </tr>
          {% endfor %}
        </tbody>
      </table>
    {% endif %}
  </div>

  <!-- Modal Structure -->
  <div class="modal fade" id="resultModal" tabindex="-1" role="dialog" aria-labelledby="resultModalLabel" aria-hidden="true">
    <div class="modal-dialog" role="document">
      <div class="modal-content">
        <div class="modal-header">
          <h5 class="modal-title" id="resultModalLabel">Full Document Text</h5>
          <button type="button" class="close" data-dismiss="modal" aria-label="Close">
            <span aria-hidden="true">&times;</span>
          </button>
        </div>
        <div class="modal-body">
          <p id="modal-fulltext"></p>
        </div>
        <div class="modal-footer">
          <button type="button" class="btn btn-secondary" data-dismiss="modal">Close</button>
        </div>
      </div>
    </div>
  </div>

  <!-- Bootstrap JS, Popper.js, and jQuery -->
  <script src="https://code.jquery.com/jquery-3.5.1.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/@popperjs/core@2.0.7/dist/umd/popper.min.js"></script>
  <script src="https://stackpath.bootstrapcdn.com/bootstrap/4.5.2/js/bootstrap.min.js"></script>

  <script>
    // Attach event listener to modal
    $('#resultModal').on('show.bs.modal', function (event) {
      var row = $(event.relatedTarget); // The row that triggered the modal
      var docno = row.data('docno'); // Extract docno from data-* attributes
      var fulltext = row.data('fulltext'); // Extract full text from data-* attributes

      // Update the modal's content
      var modal = $(this);
      modal.find('.modal-title').text('Document ' + docno);
      modal.find('#modal-fulltext').text(fulltext);
    });

    // click on row
    $(document).on('click', '.clickable-row', function () {
      $('#resultModal').modal('show');
    });
  </script>
</body>
</html>
